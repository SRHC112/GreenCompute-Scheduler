# 绿算调度 GreenCompute-Scheduler · 持续集成
#
# 触发：main 分支 push / PR、手动触发
# 目标：任何一台干净机器 clone 后都能复现「安装 → 冒烟测试 → 编排演示 → 对照实验 → 操作台」
# 原则：不引入项目本身以外的依赖；CI 命令与 README 的运行方法保持一致。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 项目主要在 Windows 上开发，额外覆盖一次 Windows + 最新 Python
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法检查（全量编译）
        run: python -m compileall -q gcs app evaluation tests

      # 安装脚本随 PR 一起校验：语法 + 只读预检（--check 不 clone、不写入）
      - name: 安装脚本自检
        run: |
          python -m py_compile install.py
          python install.py --check

      # 覆盖率工具只装在 CI（开发/运行时依赖仍仅 PyYAML，见 README「唯一运行时依赖」承诺）
      - name: 单元测试（unittest 全量 + 覆盖率统计）
        run: |
          python -m pip install coverage
          python -m coverage run --source=gcs -m unittest discover -s tests -v

      # 基线八（三）L107-108「设定覆盖率目标并纳入 CI」+ SRS TG-06 70% 取并集（更严者）
      # 本地实测基线：gcs/ 核心逻辑 87%（66 个单测）
      - name: 覆盖率检查（核心逻辑 gcs/ 目标 ≥70%）
        run: python -m coverage report --show-missing --fail-under=70

      - name: 一键编排演示
        run: python -m gcs.demo --jobs 20 --seed 7

      # 用 python 作为 shell，保证同一段校验脚本在 Ubuntu / Windows runner 上都能跑。
      # 注意：Windows runner 的 stdout 默认 cp1252，输出中文会抛 UnicodeEncodeError，
      # 因此此处统一用 ASCII 英文输出，并显式把 stdout 切到 UTF-8 兜底。
      - name: 校验看板与指标产物
        shell: python
        run: |
          import sys
          from pathlib import Path
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          root = Path("runs")
          latest = root / "latest.html"
          assert latest.is_file() and latest.stat().st_size > 0, "missing runs/latest.html"
          html = list(root.glob("run_*_full/console.html"))
          metrics = list(root.glob("run_*_full/metrics.json"))
          assert html and metrics, "missing console.html / metrics.json"
          print(f"OK: {len(html)} dashboard(s), latest.html {latest.stat().st_size} bytes")

      - name: 可视化操作台启动检查（仅 Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python app/server.py --port 8123 &
          PID=$!
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8123/ > /dev/null; then OK=1; break; fi
            sleep 0.5
          done
          kill "$PID" 2>/dev/null || true
          if [ "$OK" -ne 1 ]; then echo "操作台未能在 10 秒内响应"; exit 1; fi
          echo "操作台 HTTP 响应正常"

      - name: 上传演示产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            runs/latest.html
            runs/run_*_full/console.html
            runs/run_*_full/report.md
            runs/run_*_full/metrics.json
          if-no-files-found: ignore
          retention-days: 7

  evaluation:
    name: 对照实验 (6 组 × 3 种子)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行六组对照实验
        run: python evaluation/run_eval.py

      # 注意：run_eval.py 用 utf-8-sig 写 CSV（带 BOM），读取时必须用同一编码。
      # 输出同样保持 ASCII，兼容 Windows runner 的 cp1252 stdout。
      # 除了「存在且非空」，还要校验 summary.json 是本次运行写出的、结构可被操作台消费，
      # 否则仓库里随 commit 带入的旧文件会让该检查形同虚设。
      - name: 校验评测结果完整性
        shell: python
        run: |
          import csv
          import json
          import sys
          from collections import Counter
          from pathlib import Path
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          p = Path("evaluation/results.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 18, f"expected 18 rows (6 groups x 3 seeds), got {len(rows)}"
          groups = Counter(r["group"] for r in rows)
          assert len(groups) == 6 and set(groups.values()) == {3}, f"bad group distribution: {groups}"

          csv_mtime = p.stat().st_mtime
          for name in ("summary.md", "summary.json", "eval_report.html"):
              q = Path("evaluation") / name
              assert q.is_file() and q.stat().st_size > 0, f"missing {name}"
              assert q.stat().st_mtime >= csv_mtime - 5, f"stale {name}: older than results.csv"

          s = json.loads(Path("evaluation/summary.json").read_text(encoding="utf-8"))
          assert len(s) == 6, f"summary.json has {len(s)} groups, expected 6"
          for code, g in s.items():
              assert set(g) >= {"name", "n", "sla_rate", "budget_rate", "cost_per_gpu_hour"}, \
                  f"summary.json schema mismatch for {code}"
              for k, v in g.items():
                  if k in ("name",):
                      continue
                  if k == "n":
                      assert isinstance(v, int), f"{code}.n must be int"
                      continue
                  assert isinstance(v, list) and len(v) == 2, f"{code}.{k} must be [mean, sd]"
          print(f"OK: {len(rows)} rows, groups {dict(groups)}, summary.json fresh with {len(s)} groups")

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            evaluation/results.csv
            evaluation/summary.md
            evaluation/summary.json
            evaluation/eval_report.html
          if-no-files-found: ignore
          retention-days: 14
