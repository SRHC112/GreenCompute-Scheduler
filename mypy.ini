[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
# NOTE: keep this file pure ASCII. mypy reads it with configparser, which
# decodes using the platform locale; on an English Windows runner the locale
# is cp1252 and any non-ASCII byte raises UnicodeDecodeError before type
# checking even starts (verified on GitHub runner, 2026-11-15).
